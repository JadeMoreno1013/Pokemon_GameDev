<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pokémon GameDev: colecciona cartas, resuelve acertijos y escanea códigos.">
    <title>Pokémon GameDev | Escáner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+20&display=swap" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-custom fixed-top shadow-sm">
        <div class="container-fluid px-3">
            <a class="navbar-brand navbar-brand-custom font-jersey fw-bold" href="index.html">
                GAME<br>DEV
            </a>

            <button class="navbar-toggler border-0 px-1" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Abrir menú">
                <img src="assets/img/master-ball.png" alt="Menú" class="pokeball-icon">
            </button>

            <div class="offcanvas offcanvas-end offcanvas-custom" tabindex="-1" id="offcanvasNavbar"
                aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header border-bottom border-light border-opacity-25">
                    <h5 class="offcanvas-title font-jersey fs-3" id="offcanvasNavbarLabel">MENÚ</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                        aria-label="Cerrar menú"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3 mt-3 mt-lg-0 pe-lg-0">
                        <li class="nav-item">
                            <a class="nav-link font-jersey" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link font-jersey" href="cards.html">Cartas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link font-jersey active" aria-current="page" href="scanner.html">Escáner</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <section class="container scanner-section">

            <h1 class="font-pokemon text-white fw-bold mb-2">¡ESCANEA LAS CARTAS!</h1>
            <p class="scanner-text text-white-50 mb-4">Aquí puedes escanear las cartas...</p>

            <div class="scanner-holo-border mb-5">
                <div class="scanner-camera-area">
                    <!-- Temporal: aquí irá el video de la cámara -->
                    <span class="scanner-placeholder text-dark">ESPACIO PARA LA CÁMARA</span>
                </div>
            </div>

            <button class="font-arcade btn btn-scan">ESCANEA CARTAS</button>

        </section>
    </main>

    <footer class="game-footer text-white py-4 mt-auto">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-12 col-md-6 text-center text-md-start mb-3 mb-md-0">
                    <p class="fw-bold mb-2 small">Desarrollado por:</p>
                    <div class="d-flex justify-content-center justify-content-md-start align-items-center gap-3">
                        <img src="assets/img/logo-gamedev.png" loading="lazy" alt="Logo GameDev" class="footer-logo">
                        <img src="assets/img/logo-multimedia.png" loading="lazy" alt="Logo Ingeniería Multimedia" class="footer-logo">
                    </div>
                </div>
                <div class="col-12 col-md-6 text-center text-md-end">
                    <p class="mb-0 fw-bold">Proyecto Institucional</p>
                    <p class="mb-0 small text-white-50">Ingeniería Multimedia<br>Universidad de San Buenaventura</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

</html>
